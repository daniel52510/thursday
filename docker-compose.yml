services:
  thursday-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: thursday-core:latest
    container_name: thursday-core
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file: .env
    environment:
      # Ollama and TTS run natively on macOS so they can use the Apple GPU
      # (Docker Desktop has no Metal passthrough). See README "Apple Silicon".
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      # Native STT on the Mac GPU (stt_native.py via scripts/run_stt_native.sh, ~45 ms per
      # utterance); the CPU container (~750 ms) is the automatic fallback when it's down.
      STT_BASE_URL: ${THURSDAY_STT_URL:-http://host.docker.internal:9300}
      STT_FALLBACK_URL: http://thursday-stt:9200
      # 9000 = Qwen (scripts/run_tts_native.sh); 9001 = the CSM voice served from
      # the separate thursday-voice project. Pick with THURSDAY_TTS_PORT in .env.
      TTS_BASE_URL: http://host.docker.internal:${THURSDAY_TTS_PORT:-9000}
      SEARXNG_BASE_URL: http://searxng:8080
      # Approval pushes to his phone (approvals.py); NTFY_TOPIC (random) lives in .env.
      NTFY_URL: http://ntfy:80
      THURSDAY_PUBLIC_URL: ${THURSDAY_PUBLIC_URL:-http://thursday.local}
    depends_on:
      - searxng
    volumes:
      - ./brain:/app/brain
      # The vault key (vault.py): outside the repo and the image, read-only. Create it first
      # (32 random bytes, base64) or Docker makes a directory here and the vault stays off.
      - ${HOME}/.config/thursday/master.key:/run/secrets/thursday_master_key:ro
      # The approval gate (improvements.py): reads runner-out/ and, on his Approve, merges the
      # reviewed branch into this checkout. It refuses when the checkout has uncommitted work.
      - .:/repo
    ports:
      - "8000:8000"
      # Plain http://thursday.local (no port) on the LAN. Same app, same login.
      - "80:8000"
  # CPU-only fallback. The normal path is the native MPS service
  # (scripts/run_tts_native.sh). Enable with: docker compose --profile tts-docker up
  # and point TTS_BASE_URL at http://thursday-tts:9000.
  thursday-tts:
    container_name: thursday-tts
    profiles: ["tts-docker"]
    build:
      context: .
      dockerfile: Dockerfile.tts
    volumes:
      - ./out/tts:/app/out/tts
      - ./voices:/app/voices:ro
    ports:
      - "9000:9000"
    environment:
      TTS_DEVICE: cpu
      TTS_DTYPE: float32
  thursday-stt:
    container_name: thursday-stt
    build:
      context: .
      dockerfile: Dockerfile.stt
    restart: unless-stopped
    volumes:
      - ./out/stt:/app/out/stt
    ports:
      - "9200:9200"
    environment:
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      STT_MODEL_SIZE: small
  # Phone notifications (the ntfy app subscribes to NTFY_TOPIC here). LAN only, no auth: the
  # random topic is the only lock. The upstream only wakes iPhones: it gets a message id, no text.
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    command: serve
    environment:
      NTFY_BASE_URL: ${THURSDAY_NTFY_URL:-http://thursday.local:2586}
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    ports:
      - "2586:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    restart: unless-stopped
  # Self-improvement jobs (runner/agent.py): a worker for the jobs THURSDAY queues out loud
  # (improvements.improve_start), or one job by hand: scripts/improve.sh "task". It sees the repo's
  # .git read-only (never .env, brain/ or ignored files) and writes only runner-out/. No env_file,
  # no Docker socket, capped CPU and memory. It takes the GPU only when the house is quiet.
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile  # allowlist: runner/Dockerfile.dockerignore
    command: ["--worker"]
    restart: unless-stopped
    image: thursday-runner:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      RUNNER_MODEL: ${RUNNER_MODEL:-gemma4:31b}
      RUNNER_BASE: ${RUNNER_BASE:-container-branch}
    volumes:
      - ./.git:/repo.git:ro
      - ./runner-out:/out
    cpus: 2
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
  # Deploys a merged self-improvement change when he taps Deploy (deploy/deployer.sh): tests, rebuild,
  # health check, rollback. The only container with the Docker socket, which is root on Docker: it
  # listens on nothing and runs one fixed sequence. The repo is mounted at its host path because
  # compose resolves the other services' bind mounts against it; it reads .env for the same reason.
  deployer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: thursday-deployer:latest
    restart: unless-stopped
    environment:
      REPO: ${PWD}
      HOME: ${HOME}
    working_dir: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      - BASE_URL=http://localhost:55000/
      # settings.yml is mounted read-only OUTSIDE /etc/searxng: the image chowns
      # /etc/searxng on every start, which locks git out of the host folder.
      - SEARXNG_SETTINGS_PATH=/etc/thursday-searxng/settings.yml
      # secret_key lives in .env, not in the committed settings.yml
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (openssl rand -hex 32)}
    ports:
      - "55000:8080"
    volumes:
      - ./searxng/settings.yml:/etc/thursday-searxng/settings.yml:ro
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  ntfy-cache:
