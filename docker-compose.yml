services:
  thursday-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: thursday-core:latest
    container_name: thursday-core
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file: .env
    environment:
      # Ollama and TTS run natively on macOS so they can use the Apple GPU
      # (Docker Desktop has no Metal passthrough). See README "Apple Silicon".
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      STT_BASE_URL: http://thursday-stt:9200
      TTS_BASE_URL: http://host.docker.internal:9000
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on:
      - searxng
    volumes:
      - ./brain:/app/brain
    ports:
      - "8000:8000"
  # CPU-only fallback. The normal path is the native MPS service
  # (scripts/run_tts_native.sh). Enable with: docker compose --profile tts-docker up
  # and point TTS_BASE_URL at http://thursday-tts:9000.
  thursday-tts:
    container_name: thursday-tts
    profiles: ["tts-docker"]
    build:
      context: .
      dockerfile: Dockerfile.tts
    volumes:
      - ./out/tts:/app/out/tts
    ports:
      - "9000:9000"
    environment:
      TTS_DEVICE: cpu
      TTS_DTYPE: float32
  thursday-stt:
    container_name: thursday-stt
    build:
      context: .
      dockerfile: Dockerfile.stt
    volumes:
      - ./out/stt:/app/out/stt
    ports:
      - "9200:9200"
    environment:
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      STT_MODEL_SIZE: small
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      - BASE_URL=http://localhost:55000/
      # settings.yml is mounted read-only OUTSIDE /etc/searxng: the image chowns
      # /etc/searxng on every start, which locks git out of the host folder.
      - SEARXNG_SETTINGS_PATH=/etc/thursday-searxng/settings.yml
      # secret_key lives in .env, not in the committed settings.yml
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (openssl rand -hex 32)}
    ports:
      - "55000:8080"
    volumes:
      - ./searxng/settings.yml:/etc/thursday-searxng/settings.yml:ro
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
  thursday-ui:
    # Same image as thursday-core (built once), different command.
    image: thursday-core:latest
    pull_policy: never
    container_name: thursday-ui
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      STT_BASE_URL: http://thursday-stt:9200
      TTS_BASE_URL: http://host.docker.internal:9000
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on:
      - thursday-core
      - thursday-stt
      - searxng
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]